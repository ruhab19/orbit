<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap');
  body { width: 260px; background: #0d0d14; color: #e8e8f0; font-family: 'DM Mono', monospace; margin: 0; padding: 0; }
  .header { padding: 16px; border-bottom: 1px solid #252535; background: #0a0a10; }
  .logo { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #7c6aff, #ff6a9b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { font-size: 10px; color: #5a5a70; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
  .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .stat-row { display: flex; gap: 10px; }
  .stat { flex: 1; background: #131320; border: 1px solid #252535; border-radius: 10px; padding: 12px; text-align: center; }
  .stat-num { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; color: #6affd4; }
  .stat-label { font-size: 10px; color: #5a5a70; letter-spacing: 1px; margin-top: 2px; }
  .tip { background: rgba(124,106,255,0.08); border: 1px solid rgba(124,106,255,0.2); border-radius: 10px; padding: 12px; font-size: 12px; line-height: 1.6; color: #9090b0; }
  .tip strong { color: #7c6aff; font-family: 'Syne', sans-serif; }
  .open-btn { width: 100%; padding: 11px; background: linear-gradient(135deg, #7c6aff, #5a48e8); border: none; border-radius: 9px; color: white; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
  .open-btn:hover { box-shadow: 0 6px 20px rgba(124,106,255,0.4); }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">◉ Orbit</div>
    <div class="sub">Relationship Intelligence</div>
  </div>
  <div class="body">
    <div class="stat-row">
      <div class="stat">
        <div class="stat-num" id="total">—</div>
        <div class="stat-label">Contacts</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="cold" style="color:#ff6a9b">—</div>
        <div class="stat-label">Going Cold</div>
      </div>
    </div>
    <div class="tip">
      <strong>How to use:</strong> Visit any LinkedIn profile and Orbit's sidebar will appear. Add contacts, generate AI follow-ups, and send messages directly.
    </div>
    <button class="open-btn" id="open-linkedin">Open LinkedIn →</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
